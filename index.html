<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日照復能管理系統</title>
<meta name="description" content="長照日間照顧中心復能系統：評估、開立復能處方、照服員執行紀錄、再評估與修正，並依評鑑基準自動檢核。">
<style>
:root{
  --bg:#f5f6f3; --surface:#ffffff; --surface2:#f0f2ee; --line:#dfe3dc; --text:#1f2a24; --muted:#5f6b64;
  --pri:#2f7d5b; --pri-d:#22654a; --pri-l:#e3f1ea; --accent:#c9792b;
  --ok:#2f7d5b; --ok-l:#e3f1ea; --warn:#b7791f; --warn-l:#fbf0dc; --err:#b9403a; --err-l:#f9e3e1; --purple:#6b4fa0; --purple-l:#efe9f8;
  --radius:12px; --shadow:0 1px 2px rgba(20,40,30,.06),0 2px 8px rgba(20,40,30,.05);
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --surface2:#232d28; --line:#33403a; --text:#e6ece8; --muted:#9aa8a0;
  --pri:#5fbf92; --pri-d:#7dd3aa; --pri-l:#21392e; --ok:#5fbf92; --ok-l:#21392e; --warn:#e0a84a; --warn-l:#3a3020; --err:#ec7a72; --err-l:#3d2422; --purple:#b49be0; --purple-l:#2e2640; color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#141a17; --surface:#1c2420; --surface2:#232d28; --line:#33403a; --text:#e6ece8; --muted:#9aa8a0; --pri:#5fbf92; --pri-d:#7dd3aa; --pri-l:#21392e; --ok:#5fbf92; --ok-l:#21392e; --warn:#e0a84a; --warn-l:#3a3020; --err:#ec7a72; --err-l:#3d2422; --purple:#b49be0; --purple-l:#2e2640; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55}
a{color:var(--pri)}
.ic{flex:none;vertical-align:middle}
#layout{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
#side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center}
.b1{font-weight:700;font-size:16px}.b2{font-size:12px;color:var(--muted)}
#side nav{display:flex;flex-direction:column;gap:2px}
#side nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--text);text-decoration:none;font-weight:500}
#side nav a:hover{background:var(--surface2)}
#side nav a.on{background:var(--pri-l);color:var(--pri-d);font-weight:700}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px 8px 0;border-top:1px solid var(--line)}
#mainwrap{min-width:0}
#top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line)}
.top-title b{font-size:20px}.top-title small{margin-left:10px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
#main{padding:20px 24px 80px;max-width:1280px}
.sp{flex:1}
.only-m{display:none}
/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card.flush{padding:0;overflow:hidden}
.card.hl{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-l)}
.card.dim{opacity:.85}
.card h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid2>.card{margin-bottom:0}.grid2{margin-bottom:16px}
.grid2.tight{gap:20px;margin:0}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpis.sm .kpi{box-shadow:none;background:var(--surface2)}
.k-n{font-size:30px;font-weight:700;color:var(--pri-d);line-height:1.15;font-variant-numeric:tabular-nums}.k-n small{font-size:15px;margin-left:2px}
.k-l{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:3px}
.mini-bar{display:inline-block;width:60px;height:6px;background:var(--surface2);border-radius:3px;margin-right:6px;vertical-align:middle;overflow:hidden}.mini-bar i{display:block;height:100%;background:var(--pri)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.primary:hover{background:var(--pri-d)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--err);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:14px;min-height:32px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.icon-btn{border:0;background:transparent;color:var(--text);padding:8px;border-radius:8px;cursor:pointer}
.icon-btn:hover{background:var(--surface2)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}
/* forms */
.inp{font:inherit;font-size:15px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:40px}
.inp.sm{padding:4px 8px;min-height:34px;width:auto}
.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--pri-l)}
textarea.inp{resize:vertical}
.inp-num{max-width:140px}
.inp.w6{max-width:110px}
.toolbar .inp{width:auto}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.lbl{font-size:14px;font-weight:600;color:var(--muted)}
.req{color:var(--err)}
.hint{font-size:13px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}.form-grid.g3{grid-template-columns:repeat(3,1fr)}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill input,.chk input{position:absolute;opacity:0;width:1px;height:1px}
.pill span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:14px;min-height:36px}
.pill input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}
.pill input:focus-visible+span,.chk input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent)}
.pills.vert{flex-direction:column}.pills.vert .pill span{border-radius:10px;width:100%;display:block}
.chk{display:inline-flex;align-items:flex-start;gap:8px;cursor:pointer;margin:4px 12px 4px 0;position:relative}
.chk span::before{content:"";display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-radius:5px;margin-right:8px;vertical-align:-4px;background:var(--surface)}
.chk input:checked+span::before{background:var(--pri);border-color:var(--pri);box-shadow:inset 0 0 0 3px var(--surface)}
.chk small{display:block;color:var(--muted);margin-left:26px}.chk small.ref{color:var(--accent)}
.q{border-top:1px solid var(--line);padding:12px 0}.q:first-child{border-top:0;padding-top:0}
.qh{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.prev{font-size:13px;color:var(--accent);background:var(--warn-l);padding:1px 8px;border-radius:999px}
.calc{font-size:20px;font-weight:700;color:var(--pri-d);padding:6px 0}
.row-edit{display:flex;gap:8px;margin-bottom:6px;align-items:center}
/* table */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface2);white-space:nowrap}
.tbl.sm th,.tbl.sm td{padding:6px 8px}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface2)}
.tbl.qa td:last-child{width:200px}
.nowrap{white-space:nowrap}
/* misc */
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;vertical-align:1px}
.badge.green{background:var(--ok-l);color:var(--ok);border-color:transparent}.badge.red{background:var(--err-l);color:var(--err);border-color:transparent}.badge.amber{background:var(--warn-l);color:var(--warn);border-color:transparent}.badge.purple{background:var(--purple-l);color:var(--purple);border-color:transparent}
.empty{text-align:center;color:var(--muted);padding:24px}
.muted{color:var(--muted)}.pad{padding:10px 0}
.notice{background:var(--pri-l);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.notice.warn{background:var(--warn-l)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sticky-bar{position:sticky;top:61px;z-index:4;background:var(--bg);padding:8px 0;margin-top:-8px}
.jump{display:flex;gap:2px;flex-wrap:wrap}.jump a{font-size:13px;padding:4px 8px;border-radius:6px;text-decoration:none}.jump a:hover{background:var(--surface2)}
.list{margin:4px 0;padding-left:20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs a.on{color:var(--pri-d);border-color:var(--pri);font-weight:700}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;margin:0}.info dt{font-size:13px;color:var(--muted)}.info dd{margin:0}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.todo li:last-child{border:0}
.todo .tt{flex:1}.todo .dot{width:10px;height:10px;border-radius:50%;flex:none}
.lv-high .dot{background:var(--err)}.lv-mid .dot{background:var(--warn)}.lv-low .dot{background:var(--muted)}
.checks{list-style:none;padding:0;margin:0}.checks li{padding:7px 0;border-bottom:1px dashed var(--line)}.checks li.ok{color:var(--text)}.checks li.no{color:var(--err)}
.checks li small{color:var(--muted)}.checks .det{font-size:13px;color:var(--muted);margin:2px 0 0 18px}.checks .det a{color:var(--err)}
.cycle{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.step{flex:1;min-width:140px;background:var(--surface2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.step small{color:var(--muted);font-size:13px}.sn{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.arrow{align-self:center;color:var(--muted);font-size:20px}
.ind .code{background:var(--pri);color:#fff;font-size:13px;padding:2px 8px;border-radius:6px}
/* today */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.tcard.absent{opacity:.6}
.tcard header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{width:44px;height:44px;border-radius:50%;background:var(--pri-l);color:var(--pri-d);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.tn{flex:1;min-width:120px}.tn b{font-size:18px;display:block}.tn small{color:var(--muted)}
.att{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;min-height:36px;color:var(--text)}
.seg.on{background:var(--pri);color:#fff;border-color:var(--pri)}.seg.on.warn{background:var(--warn);border-color:var(--warn)}
.temp{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted)}.temp input{width:72px;font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);min-height:36px}
.temp.warn input{border-color:var(--err);background:var(--err-l)}
.tprog{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin:10px 0 4px}.tprog .bar{flex:1;margin:0}
.items{list-style:none;margin:0;padding:0}
.it{border-top:1px solid var(--line);padding:10px 0}
.anthro{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warn-l)}.anthro.ok{background:var(--surface2)}
.an-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.an-h small{font-size:13px}
.an-b{display:flex;gap:14px;flex-wrap:wrap}.an-b .temp small{margin-left:4px}.an-f{font-size:13px;margin-top:6px}
.it-main{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.it-t{flex:1;min-width:160px}.it-t b{font-size:16px}.it-t small{display:block;color:var(--muted);font-size:13px}.it-t .badge{margin-left:6px}
.it-b{display:flex;gap:6px}
.sbtn{border:2px solid var(--line);background:var(--surface);border-radius:10px;min-width:56px;min-height:52px;font:inherit;font-size:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;color:var(--muted)}
.sbtn span{font-size:12px}
.sbtn.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}.sbtn.part.on{background:var(--warn);border-color:var(--warn);color:#fff}.sbtn.skip.on{background:var(--err);border-color:var(--err);color:#fff}
.sbtn.more{font-size:13px;min-width:48px}
.it.st-ok .it-t b{color:var(--ok)}
.it-detail{background:var(--surface2);border-radius:10px;padding:12px;margin-top:10px}
.how{font-size:14px;margin-bottom:10px}.warn-t{color:var(--err)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* grid exec */
.grid-t{border-collapse:collapse;font-size:13px}
.grid-t th,.grid-t td{border:1px solid var(--line);padding:4px;text-align:center;min-width:28px}
.grid-t th{background:var(--surface2);font-weight:500}.grid-t th small{color:var(--muted)}
.grid-t th.we{color:var(--err)}
.grid-t .sticky{position:sticky;left:0;background:var(--surface);text-align:left;white-space:nowrap;min-width:150px;z-index:1}
.g-ok{background:var(--ok-l);color:var(--ok);font-weight:700}.g-part{background:var(--warn-l);color:var(--warn);font-weight:700}.g-skip{background:var(--err-l);color:var(--err);font-weight:700}.g-miss{color:var(--err)}
.legend{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.legend .g{display:inline-block;width:24px;text-align:center;border-radius:4px}
.feed{list-style:none;margin:0;padding:0}.feed li{padding:10px 0;border-bottom:1px solid var(--line)}.feed time{color:var(--muted);font-size:13px;margin-right:8px}.feed p{margin:4px 0}.feed small{color:var(--muted)}
/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:16px}.charts .card{margin:0}
.chart{width:100%;height:auto}
.chart .cg{stroke:var(--line);stroke-width:1}.chart .ct{fill:var(--muted);font-size:10px}.chart .cv{fill:var(--text);font-weight:700}
.chart .cl{fill:none;stroke:var(--pri);stroke-width:2.5}.chart .cd{fill:var(--surface);stroke:var(--pri);stroke-width:2.5}
.chart .ccut{stroke:var(--err);stroke-dasharray:4 3}.chart .cut-t{fill:var(--err)}
.chart-empty{color:var(--muted);padding:30px;text-align:center}
/* editor */
.edit-layout{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
.edit-side .sticky{position:sticky;top:130px}
.ls{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}.ls b{font-variant-numeric:tabular-nums}.ls small{color:var(--muted);font-weight:400}
.ls.flag b{color:var(--err)}
.sugg{list-style:none;padding:0;margin:0 0 12px}.sugg li{padding:6px 0;border-bottom:1px dashed var(--line)}
.item-card,.case-b{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.ic-h{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.ic-h .grow{flex:1;min-width:160px}.ic-h select{width:auto}
.libs details{border-bottom:1px solid var(--line);padding:6px 0}.libs summary{cursor:pointer;font-weight:600;padding:4px 0}
.lib{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--text);margin:2px}
.chip:hover{border-color:var(--pri)}.chip.hl{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.modal-h h3{margin:0;flex:1;font-size:18px}
.modal-b{padding:16px 18px;overflow:auto}.modal-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.25s;max-width:90vw;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:none}.toast.err{background:var(--err);color:#fff}
#print{display:none}
/* responsive */
@media (max-width:1000px){
  .grid2,.edit-layout{grid-template-columns:1fr}.edit-side{order:-1}.edit-side .sticky{position:static}
  .form-grid.g3{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  #layout{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;z-index:40;width:260px;transform:translateX(-100%);transition:.2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  body.nav-open #side{transform:none}
  .only-m{display:inline-flex}
  #top{padding:10px 16px;flex-wrap:wrap}.who{width:100%;order:3}.who select{flex:1}
  #main{padding:16px 16px 80px}
  .form-grid,.form-grid.g3{grid-template-columns:1fr}.span2,.span3{grid-column:auto}
  .tgrid{grid-template-columns:1fr}.row3{grid-template-columns:1fr}
  .info{grid-template-columns:1fr}
  .sticky-bar{top:105px}
  .top-title small{display:block;margin:0}
}
/* print */
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff;color:#000;font-size:11pt}
  #layout,#modal,#toasts,[data-oth-report]{display:none!important}
  #print{display:block}
  .p-head{text-align:center;border-bottom:2px solid #000;margin-bottom:10px;padding-bottom:6px}
  .p-center{font-size:12pt}.p-title{font-size:17pt;font-weight:700}.p-date{font-size:9pt;color:#444}
  #print h3{font-size:14pt;margin:8px 0}#print h4{font-size:12pt;margin:12px 0 4px;border-left:4px solid #000;padding-left:6px}
  #print h2{font-size:13pt;margin:10px 0 4px}
  .p-t{width:100%;border-collapse:collapse;margin:4px 0;font-size:10pt}
  .p-t th,.p-t td{border:1px solid #555;padding:3px 5px;text-align:left;vertical-align:top}

function suggestFromAssessment(a, client){
  const out=[]; if(!a) return out;
  const add=(code,text,ex,ref)=>{ if(!out.find(o=>o.code===code)) out.push({code,text,ex:ex||[],referral:ref||''}); };
  const b=a.adl||{}, has=k=>b[k]!==''&&b[k]!=null;
  if(has('transfer')&&+b.transfer<15) add('transfer','移位能力受限（巴氏移位 '+b.transfer+' 分）',['adl_transfer','str_sitstand']);
  if(has('mobility')&&+b.mobility<15) add('mobility','平地行走能力受限（巴氏走動 '+b.mobility+' 分）',['end_walk','bal_weightshift','adl_walkmeal']);
  if(has('stairs')&&+b.stairs<10) add('stairs','上下樓梯能力受限',['str_step','str_heelraise']);
  if(has('toilet')&&+b.toilet<10) add('toilet','如廁需協助',['adl_toilet']);
  if(has('dressing')&&+b.dressing<10) add('dressing','穿脫衣需協助',['adl_dress']);
  if(has('feeding')&&+b.feeding<10) add('feeding','進食需協助',['adl_feed','oral_exercise']);
  if(has('grooming')&&+b.grooming<5) add('grooming','個人衛生需協助',['adl_groom']);
  if((has('bladder')&&+b.bladder<10)||(has('bowel')&&+b.bowel<10)) add('contin','排泄控制問題',['adl_toiletschedule'],'護理師評估排泄問題');
  const p=a.phy||{}; const ag=client?ageAt(client.birth,a.date):null;
  if((p.tug!==''&&p.tug!=null&&+p.tug>=PHY_CUT.tug)||(p.oneLeg!==''&&p.oneLeg!=null&&+p.oneLeg<PHY_CUT.oneLeg)) add('fall','跌倒高風險（TUG/單腳站未達標）',['bal_chair_oneleg','bal_tandem','bal_weightshift','str_sitstand']);
  if((p.cs30!==''&&p.cs30!=null&&ag&&+p.cs30<cs30Cut(ag,client.gender))||(p.cs5!==''&&p.cs5!=null&&+p.cs5>=PHY_CUT.cs5)) add('legstr','下肢肌力不足（坐站測試低於同齡常模）',['str_sitstand','str_kneeext','str_heelraise','str_hipabd']);
  if(p.grip!==''&&p.grip!=null&&client&&+p.grip<(client.gender==='男'?PHY_CUT.gripM:PHY_CUT.gripF)) add('grip','握力不足（AWGS 肌少症切點以下）',['str_grip','str_band_row'],'營養師評估蛋白質攝取');
  if(p.gait4!==''&&p.gait4!=null&&+p.gait4>0&&4/(+p.gait4)<PHY_CUT.gait) add('gait','步行速度慢（<1.0 m/s）',['end_walk','end_march']);
  const i=a.iadl||{}, iz=k=>i[k]!==''&&i[k]!=null&&IADL.find(x=>x.k===k).opts[+i[k]]?.[1]===0;
  if(iz('meds')) add('meds','服藥管理需協助',['iadl_meds']);
  if(iz('shopping')||iz('finance')) add('shop','購物與金錢管理能力下降',['iadl_shop']);
  if(iz('cooking')) add('cook','備餐能力下降',['iadl_cook']);
  if(iz('housework')||iz('laundry')) add('house','家務能力下降',['iadl_fold']);
  if(iz('phone')) add('phone','電話使用困難',['iadl_phone']);
  const sp=scoreSPMSQ(a); if(sp&&sp.adj>=3) add('cog','認知功能退化（SPMSQ：'+spmsqLevel(sp.adj)+'）',['cog_ro','cog_game','cog_reminisce'], sp.adj>=5&&!client?.dementia?'建議轉介神經內科/精神科進行失智症診斷':'');
  const g=scoreGDS(a); if(g&&g.total>=5) add('mood','疑似憂鬱情緒（GDS-15＝'+g.total+'）',['psy_role','psy_group'],'社工關懷；必要時轉介身心科');
  const m=scoreMNA(a); if(m&&m.total<=11) add('nutri',mnaLevel(m.total)+'（MNA-SF＝'+m.total+'）',[],'轉介營養師評估');
  if(a.pain&&+a.pain.nrs>=4) add('pain','疼痛影響活動（NRS '+a.pain.nrs+'）',['rom_upper','rom_neck'],'醫師/物理治療師評估疼痛');
  (a.copm||[]).filter(c=>c.activity).forEach((c,ix)=>add('copm'+ix,'個案期待：'+c.activity,[]));
  return out;
}

/* ---------- 計分 ---------- */
function scoreBarthel(a){ const b=a?.adl; if(!b) return null; let t=0,n=0; for(const it of BARTHEL){ const v=b[it.k]; if(v===''||v==null) continue; t+=+v; n++; } return n===BARTHEL.length?{total:t,level:barthelLevel(t)}:(n?{total:t,partial:true,level:'未完成('+n+'/10)'}:null); }
function scoreIADL(a){ const b=a?.iadl; if(!b) return null; let t=0,n=0; for(const it of IADL){ const v=b[it.k]; if(v===''||v==null) continue; const o=it.opts[+v]; if(!o) continue; t+=o[1]; n++; } return n?{total:t,partial:n<IADL.length}:null; }
function scoreSPMSQ(a){ const s=a?.spmsq; if(!s||!s.items) return null; const ans=s.items.filter(x=>x==='c'||x==='x'); if(ans.length<SPMSQ.length) return ans.length?{errors:s.items.filter(x=>x==='x').length,partial:true,adj:null}:null; const e=s.items.filter(x=>x==='x').length; let adj=e; if(s.edu==='low') adj=Math.max(0,e-1); if(s.edu==='high') adj=e+1; return {errors:e,adj}; }
function scoreGDS(a){ const g=a?.gds; if(!g) return null; let t=0,n=0; GDS15.forEach((q,ix)=>{ const v=g[ix]; if(v!=='y'&&v!=='n') return; n++; if(v===q[1]) t++; }); return n===15?{total:t}:(n?{total:t,partial:true}:null); }
function scoreMNA(a){ const m=a?.mna; if(!m) return null; let t=0; for(const it of MNASF){ if(m[it.k]===''||m[it.k]==null) return null; t+=+m[it.k]; } let f=null; const bmi=calcBMI(a); if(bmi!=null) f=bmi<19?0:bmi<21?1:bmi<23?2:3; else if(m.calf!==''&&m.calf!=null) f=+m.calf<31?0:3; if(f==null) return null; return {total:t+f}; }
function calcBMI(a){ const p=a?.phy||{}; if(!+p.height||!+p.weight) return null; const h=+p.height/100; return Math.round(+p.weight/(h*h)*10)/10; }
function gaitSpeed(a){ const s=+a?.phy?.gait4; return s>0?Math.round(4/s*100)/100:null; }
function ageAt(birth, iso){ if(!birth) return null; const b=new Date(birth+'T00:00:00'), d=iso?new Date(iso+'T00:00:00'):new Date(); let y=d.getFullYear()-b.getFullYear(); if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate())) y--; return y; }

/* ---- store.js ---- */
/* ================================================================
   資料層：IndexedDB（失敗時退回 localStorage），所有資料只存在本機
   每筆紀錄含 id / updatedAt / updatedBy，刪除採軟刪除，方便多台裝置合併
   ================================================================ */
const COLLECTIONS = ['staff','clients','assessments','plans','execs','vitals','meetings','incidents','activities','contacts','library','anthro'];

const Store = (() => {
  const DB = { meta:{} };
  let idb = null, timer = null;
  const dirty = new Set();

  function openIDB(){
    return new Promise(res => {
      try {
        const r = indexedDB.open('rehab-daycare', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch(e){ res(null); }
    });
  }
  function idbGet(k){ return new Promise(res => { try { const q = idb.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch(e){ res(undefined); } }); }

  async function load(){
    idb = await openIDB();
    for (const c of ['meta', ...COLLECTIONS]) {
      let v;
      if (idb) v = await idbGet(c);
      else { try { v = JSON.parse(localStorage.getItem('rehab:'+c)); } catch(e){} }
      DB[c] = v ?? (c === 'meta' ? {} : []);
    }
    try { navigator.storage?.persist?.(); } catch(e){}
  }

  function touch(c){ dirty.add(c); clearTimeout(timer); timer = setTimeout(flush, 120); }
  function flush(){
    const cols = [...dirty]; dirty.clear();
    if (idb) {
      try {
        const tx = idb.transaction('kv','readwrite'), st = tx.objectStore('kv');
        cols.forEach(c => st.put(DB[c], c));
        tx.onerror = () => App.toast('資料儲存失敗，請立即匯出備份', 'err');
      } catch(e){ App.toast('資料儲存失敗：'+e.message, 'err'); }
    } else {
      try { cols.forEach(c => localStorage.setItem('rehab:'+c, JSON.stringify(DB[c]))); }
      catch(e){ App.toast('瀏覽器儲存空間不足，請匯出備份', 'err'); }
    }
  }
  window.addEventListener('beforeunload', () => { if (dirty.size) flush(); });

  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const all = c => DB[c].filter(r => !r.deleted);
  const get = (c, id) => DB[c].find(r => r.id === id && !r.deleted);
  function upsert(c, obj){
    const now = new Date().toISOString();
    obj.updatedAt = now; obj.updatedBy = App.currentUserId();
    if (!obj.id) { obj.id = newId(); obj.createdAt = now; DB[c].push(obj); }
    else { const i = DB[c].findIndex(r => r.id === obj.id); if (i >= 0) DB[c][i] = obj; else DB[c].push(obj); }
    touch(c); return obj;
  }
  function remove(c, id){ const r = DB[c].find(x => x.id === id); if (r) { r.deleted = true; r.updatedAt = new Date().toISOString(); touch(c); } }
  function setMeta(k, v){ DB.meta[k] = v; touch('meta'); }

  function exportAll(){ return { app:'rehab-daycare', schema:1, exportedAt:new Date().toISOString(), meta:DB.meta, ...Object.fromEntries(COLLECTIONS.map(c => [c, DB[c]])) }; }
  // 合併匯入：同 id 取 updatedAt 較新者
  function mergeImport(data, replace){
    if (!data || data.app !== 'rehab-daycare') throw new Error('檔案格式不符（不是本系統的備份檔）');
    let added = 0, updated = 0;
    for (const c of COLLECTIONS) {
      const inc = Array.isArray(data[c]) ? data[c] : [];
      if (replace) { DB[c] = inc; added += inc.length; touch(c); continue; }
      for (const r of inc) {
        const i = DB[c].findIndex(x => x.id === r.id);
        if (i < 0) { DB[c].push(r); added++; }
        else if ((r.updatedAt||'') > (DB[c][i].updatedAt||'')) { DB[c][i] = r; updated++; }
      }
      touch(c);
    }
    if (replace || !DB.meta.center) { DB.meta = { ...DB.meta, ...(data.meta||{}) }; touch('meta'); }
    return { added, updated };
  }
  function clearAll(){ COLLECTIONS.forEach(c => { DB[c] = []; touch(c); }); DB.meta = {}; touch('meta'); }

  return { DB, load, all, get, upsert, remove, setMeta, exportAll, mergeImport, clearAll, newId, flush };
})();

};
function onBind(e){
  const el = e.target, p = el.dataset?.bind; if (!p || !S.edit) return;
  let v;
  if (el.type === 'checkbox') {
    if (el.dataset.arr != null) { const x = el.dataset.num ? +el.dataset.arr : el.dataset.arr; const arr = getPath(S.edit, p) || []; v = el.checked ? [...new Set([...arr, x])] : arr.filter(y => y !== x); if (el.dataset.num) v.sort((a, b) => a - b); }
    else v = el.checked;
  } else if (el.type === 'radio') { if (!el.checked) return; v = el.dataset.t === 'num' ? +el.value : el.value; }
  else { v = el.value; if (el.dataset.t === 'num') v = v === '' ? '' : +v; }
  setPath(S.edit, p, v); S.dirty = true; if (S.onEdit) S.onEdit(p, el);
}

function download(name, data, type){ const b = data instanceof Blob ? data : new Blob([data], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportCSV(name, headers, rows){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

/* ---------- 加密備份（AES-GCM + PBKDF2） ---------- */
async function deriveKey(pw, salt){ const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:200000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']); }
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function encryptJSON(obj, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  let bin = ''; const u = new Uint8Array(ct); for (let i = 0; i < u.length; i += 32768) bin += String.fromCharCode(...u.subarray(i, i + 32768));
  return JSON.stringify({ app:'rehab-daycare', enc:'AES-GCM', salt:b64(salt), iv:b64(iv), data:btoa(bin) });
}
async function decryptJSON(wrap, pw){ const key = await deriveKey(pw, unb64(wrap.salt)); const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(wrap.iv) }, key, unb64(wrap.data)); return JSON.parse(new TextDecoder().decode(pt)); }

/* ---------- 簡易折線圖（SVG） ---------- */
function lineChart(points, o = {}){
  const pts = points.filter(p => p.y !== null && p.y !== undefined && p.y !== '' && !isNaN(p.y));
  if (pts.length === 0) return `<div class="chart-empty">尚無資料</div>`;
  const W = 320, H = 150, L = 34, R = 22, T = 16, B = 26;
  const ys = pts.map(p => +p.y).concat(o.cut != null ? [o.cut] : []);
  let min = o.min ?? Math.min(...ys), max = o.max ?? Math.max(...ys); if (min === max) { min -= 1; max += 1; }
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(+p.y).toFixed(1)}`).join('');
  const grid = [min, (min + max) / 2, max].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="cg"/><text x="${L - 5}" y="${y(v) + 4}" class="ct" text-anchor="end">${Math.round(v * 10) / 10}</text>`).join('');
  const cut = o.cut != null ? `<line x1="${L}" x2="${W - R}" y1="${y(o.cut)}" y2="${y(o.cut)}" class="ccut"/><text x="${W - R}" y="${y(o.cut) - 4}" class="ct cut-t" text-anchor="end">${esc(o.cutLabel || '切點 ' + o.cut)}</text>` : '';
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(+p.y)}" r="4" class="cd"><title>${rocDate(p.x)}：${p.y}${o.unit || ''}</title></circle><text x="${x(i)}" y="${y(+p.y) - 8}" class="ct cv" text-anchor="middle">${p.y}</text><text x="${x(i)}" y="${H - 8}" class="ct" text-anchor="middle">${rocDate(p.x).slice(-5)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.title || '')}">${grid}${cut}<path d="${path}" class="cl"/>${dots}</svg>`;
}

/* ================================================================
   業務邏輯：處方有效期、排程、執行率、再評提醒、評鑑檢核、成效指標
   ================================================================ */
const REASSESS_MONTHS = 6;      // B1-4 至少每6個月評估一次
const MEETING_MONTHS = 3;       // B1-6 每3個月至少1次跨專業個案討論會
const DEFAULT_CYCLE_DAYS = 84;  // 復能週期預設12週

const Logic = {
  assessmentsOf: cid => Store.all('assessments').filter(a => a.clientId === cid).sort(byDate('date')),
  lastAssessment(cid){ return this.assessmentsOf(cid).at(-1) || null; },
  plansOf: cid => Store.all('plans').filter(p => p.clientId === cid).sort((a, b) => (a.version || 0) - (b.version || 0)),
  activePlan(cid){ return this.plansOf(cid).filter(p => p.status === '執行中').at(-1) || null; },
  planOn(cid, iso){ return this.plansOf(cid).filter(p => p.startDate <= iso && (!p.endDate || p.endDate >= iso) && p.status !== '草稿').at(-1) || null; },
  itemsOn(plan, iso){ if (!plan) return []; const w = weekday(iso); return (plan.items || []).filter(it => (it.days || []).includes(w)); },

  index(){
    const ex = new Map(), vi = new Map(), exDay = new Set();
    for (const e of Store.all('execs')) { ex.set(e.clientId + '|' + e.itemId + '|' + e.date, e); exDay.add(e.clientId + '|' + e.date); }
    for (const v of Store.all('vitals')) vi.set(v.clientId + '|' + v.date, v);
    return { ex, vi, exDay };
  },
  /* 個案某日是否「應執行」：有出席紀錄=出席；無紀錄則看固定到班日 */
  expected(client, iso, idx){
    const v = idx.vi.get(client.id + '|' + iso);
    if (v && v.present === false) return false;
    if (v && v.present === true) return true;
    if (idx.exDay.has(client.id + '|' + iso)) return true;
    return (client.attendDays || []).includes(weekday(iso));
  },
  /* 執行統計：from~to（含），回傳整體與分項 */
  execStats(client, from, to, idx){
    idx = idx || this.index();
    const res = { expected:0, done:0, partial:0, skipped:0, missing:0, selfcare:0, byItem:{}, byCat:{} };
    const end = to > todayISO() ? todayISO() : to;
    if (client.admitDate && from < client.admitDate) from = client.admitDate;
    for (let d = from; d <= end; d = addDays(d, 1)) {
      const plan = this.planOn(client.id, d); if (!plan) continue;
      if (!this.expected(client, d, idx)) continue;
      for (const it of this.itemsOn(plan, d)) {
        res.expected++;
        const bi = res.byItem[it.id] ||= { name:it.name, cat:it.cat, expected:0, done:0, partial:0, skipped:0, missing:0 };
        const bc = res.byCat[it.cat || '其他'] ||= { expected:0, done:0, partial:0 };
        bi.expected++; bc.expected++;
        const e = idx.ex.get(client.id + '|' + it.id + '|' + d);
        if (!e) { res.missing++; bi.missing++; }
        else if (e.status === '完成') { res.done++; bi.done++; bc.done++; if (it.selfcare) res.selfcare++; }
        else if (e.status === '部分') { res.partial++; bi.partial++; bc.partial++; if (it.selfcare) res.selfcare++; }
        else { res.skipped++; bi.skipped++; }
      }
    }
    res.rate = res.expected ? Math.round((res.done + res.partial * 0.5) / res.expected * 100) : null;
    return res;
  },

  /* 再評估到期：取「上次評估+6個月」與「處方預定再評日」較早者 */
  reassessDue(cid){
    const last = this.lastAssessment(cid), plan = this.activePlan(cid);
    if (!last) return null;
    const six = addMonths(last.date, REASSESS_MONTHS);
    if (plan?.reviewDate && plan.reviewDate < six) return { date:plan.reviewDate, why:'處方預定再評日' };
    return { date:six, why:'距上次評估滿6個月' };
  },

  /* 單一個案的評鑑檢核 */
  clientChecks(c){
    const as = this.assessmentsOf(c.id), last = as.at(-1), plan = this.activePlan(c.id), today = todayISO();
    const first = as.find(a => a.type === '初評') || as[0];
    const due = this.reassessDue(c.id);
    const domains = a => !!(a && scoreBarthel(a) && !scoreBarthel(a).partial && (a.psycho || scoreSPMSQ(a) || scoreGDS(a)) && a.social && a.lifeEvents);
    const flagged = last ? suggestFromAssessment(last, c).filter(s => s.referral) : [];
    const refs = (plan?.referrals || []).filter(r => r.to);
    const idx = this.index();
    const st = plan ? this.execStats(c, addDays(today, -29), today, idx) : null;
    return {
      hasPlan: !!plan,
      domains: domains(first) || domains(last),
      planFromAssess: !!(plan && plan.assessmentId && (plan.goals || []).length && (plan.items || []).length),
      execRecorded: !!(st && st.expected && st.missing / st.expected < 0.2),
      reassessOK: !!(due && due.date >= today),
      reassessDue: due,
      referralOK: flagged.length === 0 || refs.length > 0,
      flagged, st, plan, last,
      lastContact: Store.all('contacts').filter(x => x.clientId === c.id).sort(byDate('date')).at(-1)?.date || null,
    };
  },

  meetings(){ return Store.all('meetings').sort(byDate('date')); },
  lastMeeting(){ return this.meetings().at(-1) || null; },
  openDecisions(){ const out = []; for (const m of this.meetings()) for (const d of (m.decisions || [])) if (d.status !== '已完成') out.push({ ...d, meetingId:m.id, meetingDate:m.date }); return out; },
  meetingDisciplines(m){ const set = new Set(); (m.attendees || []).forEach(id => { const r = staffRole(id); if (r) set.add(r); }); (m.external || []).forEach(x => x.discipline && set.add(x.discipline)); return [...set]; },

  /* 照服員回報警示（7天內不適停止、或標記需治療師注意且未處理） */
  alerts(){
    const since = addDays(todayISO(), -7);
    return Store.all('execs').filter(e => e.date >= since && (e.tolerance === '不適停止' || e.flag) && !e.ack).sort(byDate('date')).reverse();
  },
  /* 連續3次以上未執行之處方項目 */
  repeatedSkips(){
    const out = [];
    for (const c of Store.all('clients').filter(c => c.status === '服務中')) {
      const plan = this.activePlan(c.id); if (!plan) continue;
      for (const it of plan.items || []) {
        const es = Store.all('execs').filter(e => e.clientId === c.id && e.itemId === it.id).sort(byDate('date')).slice(-3);
        if (es.length === 3 && es.every(e => e.status === '未執行' && e.reason !== '個案請假/未到')) out.push({ client:c, item:it, reasons:[...new Set(es.map(e => e.reason))].join('、') });
      }
    }
    return out;
  },

  /* 成效指標 */
  outcomes(){
    const clients = Store.all('clients').filter(c => c.status !== '結案' || c.closeDate >= addMonths(todayISO(), -12));
    let pairs = 0, keep = 0, improve = 0, goals = 0, met = 0, copmN = 0, copmUp = 0;
    for (const c of clients) {
      const as = this.assessmentsOf(c.id).filter(a => scoreBarthel(a) && !scoreBarthel(a).partial);
      if (as.length >= 2) { const a0 = scoreBarthel(as.at(-2)).total, a1 = scoreBarthel(as.at(-1)).total; pairs++; if (a1 >= a0) keep++; if (a1 > a0) improve++; }
      for (const a of this.assessmentsOf(c.id)) for (const g of (a.goalReview || [])) if (g.gas !== '' && g.gas != null) { goals++; if (+g.gas >= 0) met++; }
      const cs = this.assessmentsOf(c.id).filter(a => (a.copm || []).some(x => x.activity && x.perf));
      if (cs.length >= 2) { const p = a => { const v = a.copm.filter(x => x.activity && x.perf).map(x => +x.perf); return v.reduce((s, x) => s + x, 0) / v.length; }; copmN++; if (p(cs.at(-1)) - p(cs[0]) >= 2) copmUp++; }
    }
    const today = todayISO(), from = addDays(today, -29), idx = this.index();
    let ex = 0, dn = 0, pa = 0, days = 0;
    for (const c of Store.all('clients').filter(c => c.status === '服務中')) { const s = this.execStats(c, from, today, idx); ex += s.expected; dn += s.done; pa += s.partial; }
    for (const v of Store.all('vitals')) if (v.present && v.date >= addMonths(today, -12)) days++;
    const falls = Store.all('incidents').filter(i => i.type === '跌倒' && i.datetime?.slice(0, 10) >= addMonths(today, -12)).length;
    return {
      adlKeep: pct(keep, pairs), adlImprove: pct(improve, pairs), pairs,
      goalMet: pct(met, goals), goals,
      copmUp: pct(copmUp, copmN), copmN,
      execRate: ex ? Math.round((dn + pa * 0.5) / ex * 100) : null, ex,
      fallRate: days ? Math.round(falls / days * 1000 * 100) / 100 : null, falls, days,
    };
  },
};

let ignoreHash = false;
function route(){
  let h = location.hash || '#/'; try { h = decodeURIComponent(h); } catch(e){}
  for (const [re, fn] of ROUTES) {
    const m = h.match(re);
    if (m) { S.edit = null; S.onEdit = null; S.dirty = false; const html = fn(m); if (html != null) { $('#main').innerHTML = html; } $('#main').scrollTop = 0; window.scrollTo(0, 0); S.lastHash = h; renderShellNav(); return; }
  }
  location.hash = '#/';
}
function renderShellNav(){ let cur = location.hash || '#/'; if (/^#\/(assess|plan)\//.test(cur)) cur = '#/client/'; document.querySelectorAll('#side nav a').forEach(a => { const h = a.getAttribute('href'); a.classList.toggle('on', cur === h || (h !== '#/' && cur.startsWith(h.replace(/s$/, '')))); }); document.body.classList.remove('nav-open'); }
window.addEventListener('hashchange', () => {
  if (ignoreHash) { ignoreHash = false; return; }
  if (S.dirty && !askConfirm('目前編輯的內容尚未儲存，確定要離開嗎？')) { ignoreHash = true; location.hash = S.lastHash; return; }
  route();
});
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* 每月體位量測（臂中圍、小腿圍；無法量體重者） */
const anthroOf = cid => Store.all('anthro').filter(x => x.clientId === cid).sort(byDate('date'));
const anthroCur = (cid, d) => anthroOf(cid).find(x => x.date.slice(0, 7) === d.slice(0, 7));
function anthroRow(c, d){
  const cur = anthroCur(c.id, d), prev = anthroOf(c.id).filter(x => x.date.slice(0, 7) < d.slice(0, 7)).at(-1);
  const flags = anthroFlags(c, cur), done = cur && cur.mac !== '' && cur.mac != null && cur.calf !== '' && cur.calf != null;
  const delta = k => cur && prev && cur[k] !== '' && cur[k] != null && prev[k] !== '' && prev[k] != null ? ` <small class="${+cur[k] < +prev[k] ? 'warn-t' : 'muted'}">${+cur[k] - +prev[k] > 0 ? '+' : ''}${Math.round((+cur[k] - +prev[k]) * 10) / 10}</small>` : '';
  const inp = (k, label) => `<label class="temp ${cur && anthroFlags(c, { [k]:cur[k] }).length ? 'warn' : ''}">${label}<input type="number" step="0.1" min="10" max="60" inputmode="decimal" value="${esc(cur?.[k] ?? '')}" onchange="setAnthro('${c.id}','${k}',this.value)" aria-label="${esc(c.name)} ${label}">cm${delta(k)}</label>`;
  return `<div class="anthro ${done ? 'ok' : ''}"><div class="an-h"><b>每月體位量測</b> ${done ? badge('本月已量測 ' + rocDate(cur.date).slice(-5), 'green') : badge('本月尚未量測', 'amber')}
    ${prev ? `<small class="muted">上次 ${rocDate(prev.date)}：臂中圍 ${prev.mac ?? '—'}、小腿圍 ${prev.calf ?? '—'} cm</small>` : ''}</div>
    <div class="an-b">${inp('mac', '臂中圍')}${inp('calf', '小腿圍')}</div>
    ${flags.length ? `<div class="warn-t an-f">⚠ ${flags.join('；')}，請通知護理師/營養師</div>` : ''}</div>`;
}
function setAnthro(cid, k, v){
  const d = S.todayDate, c = Store.get('clients', cid);
  const r = anthroCur(cid, d) || { clientId:cid, date:d };
  r[k] = v === '' ? '' : +v; r.date = d; r.staffId = App.currentUserId();
  Store.upsert('anthro', r);
  const f = anthroFlags(c, { [k]:r[k] }); if (f.length) toast(`${c.name}：${f.join('；')}`, 'err');
  refreshTodayCard(cid);
}
function findExec(cid, iid, d){ return Store.all('execs').find(e => e.clientId === cid && e.itemId === iid && e.date === d); }
function markExec(cid, iid, status){
  const d = S.todayDate, plan = Logic.planOn(cid, d), it = plan?.items.find(x => x.id === iid); if (!it) return;
  let e = findExec(cid, iid, d);
  if (e && e.status === status) { Store.remove('execs', e.id); refreshTodayCard(cid); return; } // 再按一次取消
  e = e || { clientId:cid, itemId:iid, date:d };
  Object.assign(e, { status, planId:plan.id, itemName:it.name, cat:it.cat, staffId:App.currentUserId() });
  if (status !== '未執行') delete e.reason;
  if (status === '完成' && !e.amount) e.amount = it.dose;
  Store.upsert('execs', e);
  if (status === '未執行') S.openExec = cid + '|' + iid;
  ensurePresent(cid, d);
  refreshTodayCard(cid);
}
function patchExec(cid, iid, k, v){
  const d = S.todayDate; let e = findExec(cid, iid, d);
  if (!e) { const plan = Logic.planOn(cid, d), it = plan?.items.find(x => x.id === iid); e = { clientId:cid, itemId:iid, date:d, status:'部分', planId:plan?.id, itemName:it?.name, cat:it?.cat, staffId:App.currentUserId() }; }
  e[k] = v; if (k === 'tolerance' && v === '不適停止') e.flag = true;
  Store.upsert('execs', e); if (k === 'tolerance' || k === 'flag') refreshTodayCard(cid);
}
function ensurePresent(cid, d){ let v = Store.all('vitals').find(x => x.clientId === cid && x.date === d); if (!v) Store.upsert('vitals', { clientId:cid, date:d, present:true }); }
function setPresent(cid, p){ const d = S.todayDate; let v = Store.all('vitals').find(x => x.clientId === cid && x.date === d) || { clientId:cid, date:d }; v.present = v.present === p ? null : p; Store.upsert('vitals', v); refreshTodayCard(cid); }
function setTemp(cid, t){ const d = S.todayDate; let v = Store.all('vitals').find(x => x.clientId === cid && x.date === d) || { clientId:cid, date:d }; v.temp = t === '' ? '' : +t; if (t !== '' && v.present == null) v.present = true; Store.upsert('vitals', v); if (t && (+t >= 37.5 || +t < 35.5)) toast(`${clientName(cid)} 體溫 ${t}°C 異常，請通知護理師`, 'err'); refreshTodayCard(cid); }
function refreshTodayCard(cid){
  const html = pageToday(); const tmp = document.createElement('div'); tmp.innerHTML = html;
  const n = tmp.querySelector('#tc-' + cid), o = document.getElementById('tc-' + cid);
  if (n && o) o.replaceWith(n); else rerender(() => html);
  const nt = tmp.querySelector('.notice:not(.warn)'), ot = document.querySelector('#main .notice:not(.warn)'); if (nt && ot) ot.replaceWith(nt);
}

function clientExec(c){
  const today = todayISO(), from = addDays(today, -27), idx = Logic.index();
  const days = []; for (let d = from; d <= today; d = addDays(d, 1)) days.push(d);
  const plan = Logic.activePlan(c.id); const items = plan ? plan.items : [];
  const st = Logic.execStats(c, from, today, idx);
  const sym = { 完成:'✓', 部分:'△', 未執行:'✕' };
  const grid = items.map(it => `<tr><th class="sticky">${esc(it.name)}</th>${days.map(d => {
    const p = Logic.planOn(c.id, d), sched = Logic.itemsOn(p, d).some(x => x.id === it.id) && Logic.expected(c, d, idx);
    const e = idx.ex.get(c.id + '|' + it.id + '|' + d);
    return `<td class="g ${e ? 'g-' + ({ 完成:'ok', 部分:'part', 未執行:'skip' })[e.status] : sched && d <= today ? 'g-miss' : ''}" title="${rocDate(d)} ${e ? e.status + (e.reason ? '（' + e.reason + '）' : '') + (e.note ? '：' + e.note : '') : sched ? '未記錄' : ''}">${e ? sym[e.status] : sched ? '·' : ''}</td>`; }).join('')}<td>${st.byItem[it.id] ? Math.round((st.byItem[it.id].done + st.byItem[it.id].partial * 0.5) / st.byItem[it.id].expected * 100) + '%' : '—'}</td></tr>`).join('');
  const notes = Store.all('execs').filter(e => e.clientId === c.id && (e.note || e.tolerance === '疲累' || e.tolerance === '不適停止')).sort(byDate('date')).reverse().slice(0, 30);
  return `<section class="card"><h2>近4週執行狀況 <small>執行率 ${st.rate ?? '—'}%｜完成 ${st.done}｜部分 ${st.partial}｜未執行 ${st.skipped}｜未記錄 ${st.missing}</small></h2>
    ${items.length ? `<div class="tbl-wrap"><table class="grid-t"><thead><tr><th class="sticky">項目</th>${days.map(d => `<th class="${[6, 7].includes(weekday(d)) ? 'we' : ''}">${d.slice(8)}<br><small>${WEEKDAYS[weekday(d)]}</small></th>`).join('')}<th>執行率</th></tr></thead><tbody>${grid}</tbody></table></div>
    <p class="legend"><span class="g g-ok">✓</span>完成 <span class="g g-part">△</span>部分 <span class="g g-skip">✕</span>未執行 <span class="g g-miss">·</span>應執行未記錄</p>` : empty('目前沒有生效處方')}</section>
  <section class="card"><h2>照服員觀察紀錄</h2>${notes.length ? `<ul class="feed">${notes.map(e => `<li><time>${rocDate(e.date)}</time><b>${esc(e.itemName || '')}</b> ${e.tolerance ? badge(e.tolerance, e.tolerance === '不適停止' ? 'red' : e.tolerance === '疲累' ? 'amber' : '') : ''} ${e.assist ? badge(e.assist) : ''}<p>${esc(e.note || '')}</p><small>${esc(staffName(e.staffId || e.updatedBy))}</small></li>`).join('')}</ul>` : empty('尚無觀察紀錄')}</section>`;
}

function clientOutcome(c){
  const as = Logic.assessmentsOf(c.id);
  const pts = f => as.map(a => ({ x:a.date, y:f(a) }));
  const charts = [
    ['巴氏量表 ADL（0–100）', pts(a => scoreBarthel(a)?.partial ? null : scoreBarthel(a)?.total), { min:0, max:100 }],
    ['IADL（0–8）', pts(a => scoreIADL(a)?.total), { min:0, max:8 }],
    ['TUG 起身行走（秒，越低越好）', pts(a => a.phy?.tug), { cut:PHY_CUT.tug, cutLabel:'跌倒風險 13.5秒' }],
    ['30秒坐站（次）', pts(a => a.phy?.cs30), { min:0, cut:ageAt(c.birth) ? cs30Cut(ageAt(c.birth), c.gender) : null, cutLabel:'同齡平均下限' }],
    ['握力（公斤）', pts(a => a.phy?.grip), { min:0, cut:c.gender === '男' ? PHY_CUT.gripM : PHY_CUT.gripF, cutLabel:'AWGS 切點' }],
    ['步行速度（公尺/秒）', pts(a => gaitSpeed(a)), { min:0, cut:PHY_CUT.gait, cutLabel:'1.0 m/s' }],
  ];
  const an = anthroOf(c.id);
  if (an.length) charts.push(['臂中圍（公分，每月）', an.map(x => ({ x:x.date, y:x.mac })), { cut:ANTHRO_CUT.mac, cutLabel:'營養風險 22cm' }], ['小腿圍（公分，每月）', an.map(x => ({ x:x.date, y:x.calf })), { cut:ANTHRO_CUT.calf, cutLabel:'營養風險 31cm' }]);

  return `<div class="charts">${charts.map(([t, p, o]) => `<section class="card"><h3>${t}</h3>${lineChart(p, { ...o, title:t })}</section>`).join('')}</div>

function newAssessment(cid, type){
  const prev = Logic.lastAssessment(cid), plan = Logic.activePlan(cid);
  type = type || (prev ? '再評' : '初評');
  const a = { clientId:cid, date:todayISO(), type, assessorId:App.currentUserId(),
    adl:{}, iadl:{}, spmsq:{ items:Array(10).fill(''), edu:prev?.spmsq?.edu || '' }, gds:Array(15).fill(''), mna:{}, pain:{},
    phy:{ height:prev?.phy?.height || '' },
    physio:prev?.physio || '', psycho:prev?.psycho || '', social:prev?.social || '', lifeEvents:prev?.lifeEvents || '', expect:prev?.expect || '',
    copm:prev?.copm?.length ? prev.copm.filter(x => x.activity).map(x => ({ activity:x.activity, imp:x.imp, perf:'', sat:'' })) : [{}, {}, {}],
    problemSel:{}, customProblems:'', summary:'', carried:!!prev };
  const an = anthroOf(cid).at(-1);
  if (an && an.calf !== '' && an.calf != null && diffDays(an.date, todayISO()) <= 31) a.mna.calf = an.calf;
  if (plan && type !== '初評') a.goalReview = (plan.goals || []).map(g => ({ goalId:g.id, planId:plan.id, text:g.text, measure:g.measure, baseline:g.baseline, target:g.target, current:'', gas:'', note:'' }));

}

  if (!a.social?.trim()) miss.push('家庭及社會支持');
  if (!a.lifeEvents?.trim()) miss.push('重大生命事件');
  if (!a.psycho?.trim() && !scoreSPMSQ(a) && !scoreGDS(a)) miss.push('心理認知');
  if ((a.goalReview || []).some(g => g.gas === '' || g.gas == null)) miss.push('前次目標 GAS 達成度');
  if (miss.length && !askConfirm('以下評鑑必要內容尚未完成：\n・' + miss.join('\n・') + '\n\n仍要儲存嗎？')) return;
  const sg = suggestFromAssessment(a, c);
  a.problems = [...sg.filter(s => a.problemSel?.[s.code]), ...(a.customProblems || '').split('\n').map(t => t.trim()).filter(Boolean).map(t => ({ code:'custom', text:t, ex:[], referral:'' }))];
  delete a.carried;
  const saved = Store.upsert('assessments', a); S.dirty = false;
  toast('評估已儲存');
  const plan = Logic.activePlan(a.clientId);
  if (toPlan) App.go(`#/plan/new/${a.clientId}?from=${saved.id}${plan ? '&revise=' + plan.id : ''}`);
  else App.go(`#/client/${a.clientId}/assess`);
}

function newPlan(cid, params){
  const from = params.get('from') ? Store.get('assessments', params.get('from')) : null;
  const base = params.get('revise') ? Store.get('plans', params.get('revise')) : null;
  const ver = Math.max(0, ...Logic.plansOf(cid).map(p => p.version || 0)) + 1;
  const uid = App.currentUserId();
  const p = { clientId:cid, assessmentId:from?.id || base?.assessmentId || '', version:ver, revisedFrom:base?.id || '', status:'草稿',
    startDate:todayISO(), reviewDate:addDays(todayISO(), DEFAULT_CYCLE_DAYS), prescriberId:isPrescriber(uid) ? uid : '',
    problems:from ? (from.problems || []).map(x => x.text) : base ? [...(base.problems || [])] : [],
    longGoal:base?.longGoal || '', goals:base ? clone(base.goals || []) : [], items:base ? clone(base.items || []) : [],
    referrals:base ? clone(base.referrals || []) : [], changeReason:'', consent:{ date:todayISO() }, note:'' };
  if (from) for (const pr of (from.problems || [])) if (pr.referral && !p.referrals.some(r => r.to === pr.referral)) p.referrals.push({ to:pr.referral, reason:pr.text, date:todayISO(), result:'' });
  // 依目標評值結果自動提示
  if (base && from?.goalReview?.length) p.changeReason = from.goalReview.map(g => `「${g.text}」GAS ${g.gas === '' ? '?' : g.gas}${g.note ? '（' + g.note + '）' : ''}`).join('；') + '。';
  if (!p.goals.length) p.goals.push({ id:Store.newId(), text:'', measure:'', baseline:'', target:'', due:p.reviewDate });
  p._suggest = from ? [...new Set((from.problems || []).flatMap(x => x.ex || []))] : [];
  return p;
}

function savePlan(){
  const p = S.edit;
  const err = [];
  if (!p.prescriberId) err.push('請選擇開立人員');
  if (!p.startDate || !p.reviewDate) err.push('請填寫生效日期與預定再評估日');
  if (p.reviewDate <= p.startDate) err.push('再評估日需晚於生效日期');
  p.goals = p.goals.filter(g => g.text?.trim()); p.problems = p.problems.filter(x => x?.trim()); p.referrals = p.referrals.filter(r => r.to?.trim());
  if (!p.goals.length) err.push('至少需要一項短期目標');
  if (!p.items.length) err.push('至少需要一項處方項目');
  p.items.forEach((it, i) => { if (!it.name?.trim()) err.push(`第${i + 1}項處方未填名稱`); if (!(it.days || []).length) err.push(`「${it.name || i + 1}」未勾選執行日`); });
  if (p.version > 1 && !p.id && !p.changeReason?.trim()) err.push('請填寫修正理由');
  if (err.length) { if (!p.goals.length) p.goals.push({ id:Store.newId(), due:p.reviewDate }); rerender(planEditorHTML); return toast(err.join('；'), 'err'); }
  const isNew = !p.id; delete p._suggest;
  if (isNew) {
    for (const old of Logic.plansOf(p.clientId).filter(x => x.status === '執行中')) { old.status = '已修正'; old.endDate = addDays(p.startDate, -1); old.supersededBy = 'pending'; Store.upsert('plans', old); }
    p.status = '執行中';
  }
  const saved = Store.upsert('plans', p);
  if (isNew) Logic.plansOf(p.clientId).filter(x => x.supersededBy === 'pending').forEach(x => { x.supersededBy = saved.id; Store.upsert('plans', x); });
  S.dirty = false; toast(isNew ? `處方 v${saved.version} 已生效，照服員今日起可於「今日執行」看到` : '處方已更新');
  App.go('#/client/' + p.clientId + '/plan');
  if (isNew && askConfirm('是否列印處方箋（供個案/家屬簽名與照服員參考）？')) printPlan(saved.id);
}
function closePlan(){ if (!askConfirm('確定結案此處方？結案後照服員將不再看到此處方項目。')) return; const p = Store.get('plans', S.edit.id); p.status = '結案'; p.endDate = todayISO(); Store.upsert('plans', p); S.dirty = false; toast('處方已結案'); App.go('#/client/' + p.clientId + '/plan'); }

function scoreBy(n, total, table){ for (const [need, pts] of table) if (n >= need) return pts; return 0; }
function pageReports(){
  setTitle('評鑑自主檢核與成效指標', '依115年度社區式日間照顧評鑑基準');
  const today = todayISO(), active = Store.all('clients').filter(c => c.status === '服務中');
  const cks = active.map(c => ({ c, ...Logic.clientChecks(c) }));
  const fail = (f) => cks.filter(x => !f(x)).map(x => `<a href="#/client/${x.c.id}">${esc(x.c.name)}</a>`);
  const ms = Logic.meetings(), lm = ms.at(-1);
  const recentMs = ms.filter(m => m.date >= addMonths(today, -12));
  const gaps = []; const since = Store.all('clients').map(c => c.admitDate).filter(Boolean).sort()[0] || today; let prev = since > addMonths(today, -12) ? since : addMonths(today, -12);
  for (const m of recentMs) { if (diffDays(prev, m.date) > 92) gaps.push(`${rocDate(prev)}～${rocDate(m.date)}`); prev = m.date; }
  if (diffDays(prev, today) > 92) gaps.push(`${rocDate(prev)}～今`);
  const msOK = recentMs.length > 0 && gaps.length === 0 && recentMs.every(m => Logic.meetingDisciplines(m).length >= 3);
  const followOK = ms.length < 2 || ms.slice(1).every(m => (m.followups || []).length > 0 || !ms.slice(0, ms.indexOf(m)).some(p => (p.decisions || []).length));
  const b1 = [
    [cks.every(x => x.hasPlan), fail(x => x.hasPlan)],
    [cks.every(x => x.domains), fail(x => x.domains)],
    [cks.every(x => x.planFromAssess && x.execRecorded), fail(x => x.planFromAssess && x.execRecorded)],
    [cks.every(x => x.reassessOK), fail(x => x.reassessOK)],
    [cks.every(x => x.referralOK), fail(x => x.referralOK)],
    [msOK && followOK, [...(gaps.length ? ['間隔超過3個月：' + gaps.join('、')] : []), ...recentMs.filter(m => Logic.meetingDisciplines(m).length < 3).map(m => rocDate(m.date) + ' 專業不足3種'), ...(followOK ? [] : ['有會議未追蹤前次決議']), ...(recentMs.length ? [] : ['近一年無會議紀錄'])]],
  ];
  const b1n = b1.filter(x => x[0]).length;
  const b1pts = scoreBy(b1n, 6, [[6, 2.5], [5, 1.88], [4, 1.25], [3, 0.63]]);

  // B3 體溫
  const from30 = addDays(today, -29); let pd = 0, pt = 0;
  Store.all('vitals').filter(v => v.date >= from30 && v.present).forEach(v => { pd++; if (v.temp !== '' && v.temp != null) pt++; });
  // B5/B6
  const incs = Store.all('incidents').filter(i => i.datetime >= addMonths(today, -12));
  const incOK = incs.filter(i => i.analysis && i.improvement).length, hosp = incs.filter(i => i.toHospital), hospOK = hosp.filter(i => i.familyAt && i.hospital).length;
  // B7
  const months = []; for (let k = 11; k >= 0; k--) months.push(addMonths(today.slice(0, 7) + '-01', -k).slice(0, 7));
  const acts = Store.all('activities');
  const mOK = months.map(mo => acts.some(a => a.date?.startsWith(mo) && (a.kind === '團體活動' || a.kind === '社區活動')));
  // B8
  const contactOK = cks.filter(x => x.lastContact && diffDays(x.lastContact, today) <= 90).length;
  const yr = today.slice(0, 4), cgAct = acts.filter(a => a.kind === '照顧者支持活動' && a.date?.startsWith(yr)).length;
  // B9 輔具
  const aidsN = active.filter(c => c.aids).length;
  // B10
  const scPlans = cks.filter(x => x.plan?.items?.some(i => i.selfcare)).length, scExec = cks.reduce((s, x) => s + (x.st?.selfcare || 0), 0);
  // B11
  const staff = Store.all('staff').filter(s => s.active !== false);
  const trainings = acts.filter(a => a.kind === '員工教育訓練' && a.date?.startsWith(yr));
  const hrs = staff.map(s => { const t = trainings.filter(a => (a.staffIds || []).includes(s.id)); return { s, h:t.reduce((x, a) => x + (+a.hours || 0), 0), inf:t.some(a => a.infection), sc:t.some(a => a.selfcareTopic) }; });

  const card = (code, rows, extra = '') => `<section class="card ind"><h2><span class="code">${code}</span>${INDICATORS[code].name}${extra}</h2><ul class="checks">${rows.map(([ok, t, d]) => `<li class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✕'} ${t}${d ? `<div class="det">${d}</div>` : ''}</li>`).join('')}</ul></section>`;
  const oc = Logic.outcomes();

function catTable(){
  const today = todayISO(), from = addDays(today, -29), idx = Logic.index(), agg = {};
  Store.all('clients').filter(c => c.status === '服務中').forEach(c => { const s = Logic.execStats(c, from, today, idx); for (const [k, v] of Object.entries(s.byCat)) { const a = agg[k] ||= { expected:0, done:0, partial:0 }; a.expected += v.expected; a.done += v.done; a.partial += v.partial; } });
  const rows = Object.entries(agg); if (!rows.length) return empty('尚無資料');
  return `<table class="tbl"><thead><tr><th>類別</th><th>應執行</th><th>完成</th><th>部分</th><th>執行率</th></tr></thead><tbody>${rows.map(([k, v]) => { const r = Math.round((v.done + v.partial * 0.5) / v.expected * 100); return `<tr><td>${esc(k)}</td><td>${v.expected}</td><td>${v.done}</td><td>${v.partial}</td><td><div class="mini-bar"><i style="width:${r}%"></i></div>${r}%</td></tr>`; }).join('')}</tbody></table>`;
}

async function backup(enc){
  const data = Store.exportAll(); let out = JSON.stringify(data), name = `復能系統備份_${todayISO()}.json`;
  if (enc) { const pw = prompt('請設定備份密碼（至少6碼，遺失無法復原）：'); if (!pw) return; if (pw.length < 6) return toast('密碼至少6碼', 'err'); if (prompt('請再輸入一次密碼：') !== pw) return toast('兩次密碼不一致', 'err'); out = await encryptJSON(data, pw); name = name.replace('.json', '_加密.json'); }
  download(name, out, 'application/json'); Store.setMeta('lastBackup', new Date().toISOString()); toast('備份已下載：' + name); route();
}
async function importFile(file, replace){
  if (!file) return;
  try {
    let data = JSON.parse(await file.text());
    if (data.enc) { const pw = prompt('此為加密備份，請輸入密碼：'); if (!pw) return; try { data = await decryptJSON(data, pw); } catch(e){ return toast('密碼錯誤或檔案損壞', 'err'); } }
    if (replace && !askConfirm('將以備份檔「完全取代」目前所有資料，無法復原。確定？')) return;
    const r = Store.mergeImport(data, replace); Store.flush();
    toast(replace ? `已還原 ${r.added} 筆資料` : `合併完成：新增 ${r.added} 筆、更新 ${r.updated} 筆`); renderShell(); route();
  } catch(e){ toast('匯入失敗：' + e.message, 'err'); }
}
